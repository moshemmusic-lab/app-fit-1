packages:
  - apps/*
  - packages/*

# Expo works best with a flat node_modules in a monorepo (fewer native module
# resolution issues). See https://docs.expo.dev/guides/monorepos/
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@3.0.0'
  - '@supabase/cli-darwin-x64@3.0.0'
  - '@supabase/cli-linux-arm64-musl@3.0.0'
  - '@supabase/cli-linux-arm64@3.0.0'
  - '@supabase/cli-linux-x64-musl@3.0.0'
  - '@supabase/cli-linux-x64@3.0.0'
  - '@supabase/cli-windows-arm64@3.0.0'
  - '@supabase/cli-windows-x64@3.0.0'
  - supabase@3.0.0
  - '@next/env@16.4.4'
  - '@next/eslint-plugin-next@16.4.4'
  - '@next/swc-darwin-arm64@16.4.4'
  - '@next/swc-darwin-x64@16.4.4'
  - '@next/swc-linux-arm64-gnu@16.4.4'
  - '@next/swc-linux-arm64-musl@16.4.4'
  - '@next/swc-linux-x64-gnu@16.4.4'
  - '@next/swc-linux-x64-musl@16.4.4'
  - '@next/swc-win32-arm64-msvc@16.4.4'
  - '@next/swc-win32-x64-msvc@16.4.4'
  - eslint-config-next@16.4.4
  - next@16.4.4

nodeLinker: hoisted

# Only one copy of React may exist (Expo and Next share it). Expo pins react to
# an exact version, so react-dom (an optional peer of Expo's web runtime) must match.
overrides:
  react: 19.3.0
  react-dom: 19.3.0
